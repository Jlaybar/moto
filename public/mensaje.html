<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Petición de información</title>
    <style>
      :root {
        --bg: #0b1220;
        --panel: #0f172a;
        --panel-2: #111827;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --ok: #22c55e;
        --err: #ef4444;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: radial-gradient(1200px 600px at 50% -10%, rgba(56,189,248,.08), transparent 40%), var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        display: grid;
        place-items: center;
        padding: 16px;
      }
      .card {
        width: min(720px, 96vw);
        background: linear-gradient(180deg, rgba(15,23,42,.86), rgba(2,6,23,.86));
        border: 1px solid rgba(226,232,240,.08);
        border-radius: 18px;
        padding: 20px 18px 18px;
        box-shadow: 0 10px 30px rgba(2,6,23,.6);
      }
      .title { margin: 0 0 12px; font-size: 20px; font-weight: 800; }
      form { display: grid; gap: 10px; }
      label { color: var(--muted); font-size: 13px; }
      input, textarea { width: 100%; background: #0b1328; color: var(--text);
        border: 1px solid rgba(226,232,240,.14); border-radius: 10px; padding: 10px 12px; }
      textarea { min-height: 160px; resize: vertical; }
      input:focus, textarea:focus { outline: none; border-color: rgba(56,189,248,.6); box-shadow: 0 0 0 3px rgba(56,189,248,.12); }
      .hint { font-size: 12px; opacity: .75; }
      .row { display: flex; gap: 10px; align-items: center; margin-top: 6px; }
      button { cursor: pointer; border: 0; border-radius: 10px; padding: 10px 14px; font-weight: 700; }
      #enviar { background: linear-gradient(90deg, #22d3ee, #38bdf8); color: #06101a; }
      #enviar:hover { filter: brightness(.95); }
      .ghost { background: transparent; color: var(--text); border: 1px solid rgba(226,232,240,.18); }
      .ghost:hover { background: rgba(226,232,240,.06); }
      .status { display:none; margin-top: 6px; padding: 8px 10px; border-radius: 8px; font-size: 14px; }
      .status.ok { color: #052e16; background: rgba(34,197,94,.25); border: 1px solid rgba(34,197,94,.5); }
      .status.err { color: #450a0a; background: rgba(239,68,68,.22); border: 1px solid rgba(239,68,68,.5); }
    </style>
  </head>
  <body>
    <main class="card">
      <h1 class="title">Petición de información</h1>
      <form id="form">
        <label for="correo">Correo</label>
        <input id="correo" name="correo" type="email" placeholder="tucorreo@dominio.com" required />

        <label for="asunto">Asunto</label>
        <input id="asunto" name="asunto" type="text" maxlength="200" placeholder="Asunto de tu mensaje" required />

        <label for="body">Mensaje</label>
        <textarea id="body" name="body" maxlength="5000" placeholder="Cuéntanos en detalle..."></textarea>
        <div class="hint">Máx. 5000 caracteres.</div>

        <div class="row">
          <button type="submit" id="enviar">Enviar</button>
          <button type="button" class="ghost" id="borrar">Borrar</button>
        </div>

        <div id="status" class="status" role="status" aria-live="polite"></div>
      </form>
    </main>

    <script>
      const $ = (sel) => document.querySelector(sel);
      const form = $("#form");
      const statusBox = $("#status");

      function showStatus(msg, ok=true){
        statusBox.className = "status " + (ok ? "ok" : "err");
        statusBox.textContent = msg;
        statusBox.style.display = "block";
      }

      $("#borrar").addEventListener("click", () => {
        form.reset();
        statusBox.style.display = "none";
      });

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        statusBox.style.display = "none";

        const payload = {
          correo: $("#correo").value.trim(),
          asunto: $("#asunto").value.trim(),
          body: $("#body").value.trim(),
        };

        if(!payload.correo || !payload.asunto || !payload.body){
          showStatus("Completa correo, asunto y mensaje.", false);
          return;
        }

        try{
          const res = await fetch("/api/mensajes", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(payload)
          });

          const data = await res.json().catch(() => ({}));

          if(!res.ok || !data.ok){
            throw new Error(data.detail || data.error || "No se pudo guardar el mensaje.");
          }

          showStatus(`Mensaje guardado con ID #${data.id}. ¡Gracias!`);
          form.reset();
        }catch(err){
          showStatus(err.message || "Error de red. Inténtalo de nuevo.", false);
        }
      });
    </script>
  </body>
</html>
