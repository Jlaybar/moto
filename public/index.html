<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inicio</title>
  <style>
    :root{
      --bg: #0b1020; /* darker base */
      --card: #0e1426;
      --card-2: #0a1020;
      --muted: #9aa8bf;
      --text: #e6eef7;
      --primary: #22d3ee; /* cyan-400 */
      --primary-2: #06b6d4; /* cyan-500 */
      --ring: rgba(34,211,238,.45);
      --glow: 0 0 12px rgba(34,211,238,.45), 0 0 28px rgba(6,182,212,.35), 0 0 48px rgba(6,182,212,.25);
    }
    *{ box-sizing: border-box; }
    html, body { height: 100%; }
    body{
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans";
      color: var(--text);
      background:
        radial-gradient(1200px 800px at 10% -10%, #0c1326, transparent 60%),
        radial-gradient(900px 600px at 90% 10%, rgba(34,211,238,.08), transparent 60%),
        url('/data/img/logo_5.png') left top / cover no-repeat fixed,
        linear-gradient(180deg, #0a0f1d, var(--bg));
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    /* Modern header (glass + glow) */
    header{
      position: sticky; top: 0; z-index: 10;
      backdrop-filter: blur(10px) saturate(120%);
      background: linear-gradient(to bottom, rgba(10,16,32,.85), rgba(10,16,32,.35));
      border-bottom: 1px solid rgba(148,163,184,.15);
    }
    .container{ max-width: 1100px; margin: 0 auto; padding: 8px 12px; }
    nav{ display:flex; align-items:center; justify-content:space-between; gap: 16px; }
    .brand{
      display:flex; align-items:center; gap:10px;
      font-weight: 800; letter-spacing:.4px;
      /* Imagen como logo: sin gradiente de texto */
      background: none; -webkit-background-clip: initial; background-clip: initial; color: inherit;
      filter: none;
    }
    .brand img.logo{ display:block; height: 30px; width: auto; }
    .links{ display:flex; gap: 10px; }
    .links a{
      position: relative;
      color: var(--muted);
      text-decoration: none;
      padding: 7px 10px;
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,.18);
      background: linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,.00));
      transition: transform .18s ease, color .2s ease, box-shadow .2s ease, border-color .2s ease;
      overflow: hidden;
      isolation: isolate;
    }
    /* Shine sweep */
    .links a::before{
      content: ""; position: absolute; inset: -1px; border-radius: inherit;
      background: linear-gradient(120deg, transparent 40%, rgba(255,255,255,.25) 50%, transparent 60%);
      transform: translateX(-120%);
      transition: transform .5s ease;
      pointer-events: none; z-index: -1;
    }
    .links a:hover{
      color: var(--text);
      border-color: rgba(34,211,238,.45);
      box-shadow: var(--glow);
      transform: translateY(-1px);
    }
    .links a:hover::before{ transform: translateX(120%); }
    .links a:focus-visible{ outline: none; box-shadow: 0 0 0 3px var(--ring), var(--glow); }

    /* Main */
    main{ display:grid; place-items:center; padding: 32px 16px 56px; }
    .hero{ display:grid; gap: 14px; width: min(100%, 980px); justify-items:center; text-align:center; }
    .title{ font-size: clamp(26px, 4vw, 40px); font-weight: 800; letter-spacing:.2px; margin: 0; }
    .subtitle{ color: var(--muted); max-width: 70ch; margin: 0; }

    /* Neon card frame with animated border */
    .frame{
      width: min(100%, 880px);
      aspect-ratio: 16 / 9;
      position: relative;
      border-radius: 24px;
      overflow: hidden;
      background: radial-gradient(120% 100% at 50% 0%, #0c152b, #0a1020 70%);
      box-shadow: 0 12px 50px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.04);
    }
    .frame::before{
      content:""; position:absolute; inset:-1px; border-radius:26px;
      background: conic-gradient(from 0deg, rgba(34,211,238,.35), rgba(6,182,212,.25), transparent 40%, transparent 60%, rgba(34,211,238,.35));
      filter: blur(14px); opacity:.6;
      animation: spin 10s linear infinite;
      z-index: 0;
    }
    @keyframes spin{ to{ transform: rotate(1turn); } }

    .frame img{ position: relative; z-index: 1; width:100%; height:100%; object-fit:cover; display:block; transition: opacity .6s ease, transform .6s ease; }
    .fade-out{ opacity: 0; transform: scale(1.02); }

    /* Glowing CTA button */
    .cta{
      display:inline-block; margin-top: 6px;
      background: radial-gradient(120% 120% at 10% 0%, #7dd3fc, #22d3ee 40%, #06b6d4);
      color:#00151a; font-weight:900; text-decoration:none; letter-spacing:.3px;
      padding: 12px 22px; border-radius: 999px; border: 0;
      box-shadow: 0 10px 30px rgba(6,182,212,.28), inset 0 0 0 1px rgba(255,255,255,.18);
      transition: transform .16s ease, box-shadow .2s ease, filter .2s ease;
      position: relative; overflow:hidden;
    }
    .cta::after{
      content:""; position:absolute; inset:0; border-radius: inherit; pointer-events:none;
      background: radial-gradient(60% 80% at 50% -20%, rgba(255,255,255,.45), transparent 55%);
      mix-blend-mode: overlay; opacity:.6;
      animation: pulse 2.4s ease-in-out infinite;
    }
    @keyframes pulse{ 0%,100%{ opacity:.55; } 50%{ opacity:.85; } }
    .cta:hover{ transform: translateY(-1px) scale(1.01); box-shadow: var(--glow); filter: saturate(1.06); }
    .cta:active{ transform: translateY(0) scale(.995); }
    .cta:focus-visible{ outline:none; box-shadow: 0 0 0 4px var(--ring), var(--glow); }

    footer{ color: #7a8aa1; font-size: 14px; padding: 26px; text-align:center; border-top: 1px solid rgba(148,163,184,.15); }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <nav>
        <div class="brand"><img class="logo" src="/data/img/logo_6.png" alt="Elasticity" /></div>
        <div class="links">
          <a href="index.html" aria-current="page">Inicio</a>
          <a href="registro.html">Registro</a>
          <a href="contacto.html">Contacto</a>
        </div>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1 class="title">Elasticity </h1>
      <p class="subtitle">Un concepto matematico sencillo que perimite detectar oportunidades de compra</p>
      <div class="frame" aria-label="Presentación de imágenes">
        <img id="slide" src="/data/img/inicio01.jpg" alt="Imagen de inicio" />
      </div>

      <a class="cta" href="selecion.html">¡Empecemos!</a>
    </section>
  </main>

  <footer>
    <div>&copy; 2025 <a href="https://www.elasticity.es" target="_blank" rel="noopener">www.elasticity.es</a>. Todos los derechos reservados.</div>
  </footer>

  <script>
    // Año dinámico en el footer
    document.getElementById('year').textContent = new Date().getFullYear();

    // Slideshow simple con transición de desvanecimiento
    (function(){
      const img = document.getElementById('slide');
      const rutas = [
        '/data/img/moto_1.jpg',
        '/data/img/moto_2.jpg',
        '/data/img/moto_3.jpg',
        '/data/img/moto_4.jpg',
        '/data/img/moto_5.jpg',
        '/data/img/moto_6.jpg',
        '/data/img/moto_7.jpg'
    
      ];
      // Precarga
      rutas.forEach(src => { const i = new Image(); i.src = src; });

      let idx = 0;
      const cambiar = () => {
        idx = (idx + 1) % rutas.length;
        // animación fade
        img.classList.add('fade-out');
        setTimeout(() => { img.src = rutas[idx]; img.classList.remove('fade-out'); }, 800);
      };
      // Cambia cada 3.5s
      setInterval(cambiar, 3500);
    })();
  </script>
  <script>
    // Redirección del CTA "Empecemos" a /seleccion
    (function(){
      const cta = document.querySelector('.cta');
      if (cta) {
        cta.addEventListener('click', function(ev){
          ev.preventDefault();
          window.location.href = '/seleccion';
        });
      }
    })();
  </script>
</body>
</html>
