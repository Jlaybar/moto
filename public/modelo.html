<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Precio vs Kilómetros</title>
    <style>
      :root {
        --bg: #0b1220;
        --panel: #0f172a;
        --panel-2: #111827;
        --text: #e2e8f0;
        --accent: #38bdf8;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; display: grid; grid-template-rows: auto 1fr; }
      header { display:flex; align-items:center; gap:12px; padding: 10px 14px; background: var(--panel); border-bottom: 1px solid rgba(226,232,240,.08); }
      header h1 { font-size: 16px; margin: 0; color: var(--text); font-weight: 600; opacity: .95; }
      .inputs { display:flex; gap:8px; align-items:center; margin-left: auto; }
      .panel .inputs {
        margin-left: 0;
        gap: 10px;
        padding: 8px 10px;
        background: rgba(255,255,255,.03);
        border: 2px solid rgba(34,211,238,.55);
        border-radius: 8px;
        transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
      }
      .panel .inputs:hover{
        background: rgba(255,255,255,.05);
        border-color: rgba(34,211,238,.35);
        box-shadow: 0 0 0 3px rgba(34,211,238,.08);
      }
      .inputs input { background: #0b1328; color: var(--text); border: 1px solid rgba(226,232,240,.14); border-radius: 6px; padding: 6px 8px; min-width: 140px; }
      .inputs select { background: #ffffff; color: #000000; border: 1px solid rgba(0,0,0,.25); border-radius: 6px; padding: 6px 8px; min-width: 140px; }
      .inputs button { background: var(--accent); color: #06101a; border: 0; border-radius: 6px; padding: 7px 10px; cursor: pointer; font-weight: 600; }
      .inputs button:hover { filter: brightness(0.96); }
      main { display: grid; place-items: center; padding: 10px; }
      .panel { width: min(1200px, 98vw); border: 1px solid rgba(226,232,240,.08); border-radius: 10px; background: linear-gradient(180deg, rgba(15,23,42,.86), rgba(2,6,23,.86)); padding: 10px; }
      .title { display:flex; align-items: baseline; justify-content: space-between; padding: 4px 8px 8px; border-bottom: 1px dashed rgba(226,232,240,.1); }
      .title .left { display:flex; gap:12px; align-items: baseline; }
      .title h2 { margin: 0; font-size: 15px; font-weight: 700; opacity: .95; }
      .title small { opacity: .8; }
      .eq { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; opacity: .85; font-size: 12px; }
      .selector-hint{ color: rgba(226,232,240,.75); font-size: 12px; margin: 2px 0 6px 2px; }
      .chart-box{
        width: min(900px, 98vw);
        aspect-ratio: 3 / 2; /* 900x600 */
        padding: 6px 6px 0;
        min-height: 360px; /* Fallback para evitar alto 0 */
      }
      canvas { display: block; width: 100% !important; height: 100% !important; }
      .error { color: #fecaca; background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.25); padding: 6px 8px; border-radius: 6px; margin: 8px 0 0; }

      /* Layout fila: gráfico principal + panel lateral */
      .row { display: grid; grid-template-columns: 1fr 60px; gap: 10px; align-items: stretch; margin-top: 8px; }
      .chart-card { display:flex; }

      /* Panel lateral invertido con degradado azul arriba */
      .sidecard{ padding:8px; display:flex; flex-direction:column; gap:10px; align-items:center; }
      .side-title{ font-size:14px; color:var(--text); text-align:center; opacity: .9; }
      .grad-wrap{ position:relative; flex:1; width:100%; min-height:120px; border-radius:10px; overflow:hidden; border:1px solid rgba(255,255,255,.1); background: #0b1328; }
      .grad{ position:absolute; inset:0; background: linear-gradient(to bottom, #1e3a8a, #ffffff); opacity: .85; }
      .ticks{ position:absolute; inset:8px; display:flex; flex-direction:column; justify-content:space-between; font-size:11px; color:#f1f5f9; font-weight:600; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
      .tick{ text-align:center; }

      @media (max-width: 900px){
        .row{ grid-template-columns: 1fr; }
        .grad-wrap{ min-height:200px }
      }
    </style>
<style>header img.logo{display:block;height:28px;width:auto}</style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  </head>
  <body>
    <header>
      <img class="logo" src="/data/img/logo_6.png" alt="Elasticity" />
      <h1>Precio vs Kilómetros</h1>
    </header>
    <main>
      <div class="panel">
        <div class="selector-hint">Selecciona marca y modelo</div>
        <div class="inputs" style="padding:6px 8px; margin-bottom: 6px;">
          <label for="marca">Marca</label>
          <select id="marca"></select>
          <label for="modelo">Modelo</label>
          <select id="modelo"></select>
          <button id="cargar">Cargar</button>
        </div>
        <div class="title">
          <div class="left">
            <h2>Relación Precio vs Kilometros</h2>
            <small id="mm">-</small>
          </div>
          <div class="eq" id="eq"></div>
        </div>
        <div class="row">
          <div class="card chart-card">
            <div class="chart-box">
              <canvas id="chart"></canvas>
            </div>
          </div>

          <!-- Panel lateral invertido con degradado azul arriba -->
          <div class="card sidecard">
            <div class="side-title">Años</div>
            <div class="grad-wrap">
              <div class="grad"></div>
              <div class="ticks">
                <div class="tick">2025</div>
                <div class="tick">2024</div>
                <div class="tick">2023</div>
                <div class="tick">2022</div>
                <div class="tick">2021</div>
                <div class="tick">2020</div>
              </div>
            </div>
          </div>
        </div>
        <div id="msg" class="error" style="display:none"></div>
      </div>
    </main>
    <script>
      const gridColor = 'rgba(226,232,240,.16)';
      const textColor = getComputedStyle(document.documentElement).getPropertyValue('--text') || '#e2e8f0';
      const green = '#22c55e';
      const red = '#ef4444';
      const blue = '#60a5fa';
      const darkBlue = '#1e3a8a';
      const grayPoint = '#94a3b8';

      const $marca = document.getElementById('marca');
      const $modelo = document.getElementById('modelo');
      const $btn = document.getElementById('cargar');
      const $mm = document.getElementById('mm');
      const $eq = document.getElementById('eq');
      const $msg = document.getElementById('msg');
      const canvas = document.getElementById('chart');
      let chart = null;

      // --- Carga dinámica de modelos por marca ---
      let MODELS_INDEX_CACHE = null;
      async function loadModelsIndex(){
        if (MODELS_INDEX_CACHE) return MODELS_INDEX_CACHE;
        const tries = [
          '/api/moto_models_index',
          '/data/moto/model/models_index.json'
        ];
        for (const url of tries){
          try {
            const resp = await fetch(url, { cache: 'no-cache' });
            if (!resp.ok) continue;
            const data = await resp.json();
            if (Array.isArray(data)) {
              MODELS_INDEX_CACHE = data;
              return MODELS_INDEX_CACHE;
            }
          } catch (e) {
            // ignore and try next
          }
        }
        MODELS_INDEX_CACHE = [];
        return MODELS_INDEX_CACHE;
      }

      const norm = (s) => String(s||'').trim().toLowerCase();

      function fillSelect(selectEl, values, preferred, labelFn){
        const current = selectEl.value;
        selectEl.innerHTML = '';
        for (const v of values){
          const opt = document.createElement('option');
          opt.value = v;
          opt.textContent = labelFn ? labelFn(v) : v;
          selectEl.appendChild(opt);
        }
        // Selección prioritaria: mantener actual, luego preferred, luego primera
        const setTo = values.includes(current) ? current : (preferred && values.includes(preferred) ? preferred : (values[0] || ''));
        if (setTo) selectEl.value = setTo;
      }

      // Etiquetas visibles sin cambiar el value
      function labelBrand(v){
        const s = String(v || '').replace(/[_-]+/g, ' ').toLowerCase();
        return s.replace(/\b[a-z]/g, c => c.toUpperCase());
      }
      function labelModel(v){
        return String(v || '').replace(/_/g, ' ').toUpperCase();
      }

      async function populateBrands(){
        const index = await loadModelsIndex();
        const brands = index.map(e => e.marca).filter(Boolean);
        // Intenta mantener el valor actual o por defecto 'honda'
        if (brands.length === 0) {
          fillSelect($marca, ['honda'], 'honda', labelBrand);
        } else {
          fillSelect($marca, brands, 'honda', labelBrand);
        }
      }

      async function updateModelOptions(){
        const brand = norm($marca.value);
        const index = await loadModelsIndex();
        const entry = index.find(e => norm(e.marca) === brand);
        const models = entry ? (entry.modelos || []) : [];
        // Intenta mantener el modelo actual o por defecto 'x-adv'
        if (models.length === 0) {
          fillSelect($modelo, ['x-adv'], 'x-adv', labelModel);
        } else {
          fillSelect($modelo, models, 'x-adv', labelModel);
        }
      }

      // --- Helpers de formato / parseo robusto ---
      function fmtKm(v){
        const n = toNumberES(v);
        return Number.isFinite(n) ? n.toLocaleString('es-ES') + ' km' : String(v) + ' km';
      }
      function fmtEur(v){
        const n = toNumberES(v);
        return Number.isFinite(n) ? n.toLocaleString('es-ES') + ' €' : String(v) + ' €';
      }
      function toNumberES(v){
        if (v == null) return NaN;
        if (typeof v === 'number' && Number.isFinite(v)) return v;
        let s = String(v).toLowerCase().trim();
        s = s.replace(/[€\s]/g,'').replace(/km/g,'');
        s = s.replace(/\./g,'').replace(/,/g,'.');
        const n = Number(s);
        return Number.isFinite(n) ? n : NaN;
      }

      function yearColor(y, low, high){
        if (y == null || isNaN(low) || isNaN(high) || high <= low) return '#3b82f6';
        const t = (high - y) / (high - low); // invertido: más reciente más oscuro
        const sat = 85 * (1 - t);
        const light = 60 + 35 * t;
        return `hsla(210, ${sat}%, ${light}%, 0.98)`;
      }

      // Provincias (INE) y helper para obtener nombre desde id
      const PROVINCES = {
        1: "Alava", 2: "Albacete", 3: "Alicante", 4: "Almeria", 5: "Avila",
        6: "Badajoz", 7: "Islas Baleares", 8: "Barcelona", 9: "Burgos", 10: "Caceres",
        11: "Cadiz", 12: "Castellon", 13: "Ciudad Real", 14: "Cordoba", 15: "A Coruna",
        16: "Cuenca", 17: "Girona", 18: "Granada", 19: "Guadalajara", 20: "Guipuzcoa",
        21: "Huelva", 22: "Huesca", 23: "Jaen", 24: "Leon", 25: "Lleida",
        26: "La Rioja", 27: "Lugo", 28: "Madrid", 29: "Malaga", 30: "Murcia",
        31: "Navarra", 32: "Ourense", 33: "Asturias", 34: "Palencia", 35: "Las Palmas",
        36: "Pontevedra", 37: "Salamanca", 38: "Santa Cruz de Tenerife", 39: "Cantabria", 40: "Segovia",
        41: "Sevilla", 42: "Soria", 43: "Tarragona", 44: "Teruel", 45: "Toledo",
        46: "Valencia", 47: "Valladolid", 48: "Vizcaya", 49: "Zamora", 50: "Zaragoza",
        51: "Ceuta", 52: "Melilla"
      };

      function provinceName(id){
        const n = Number(id);
        if (!Number.isFinite(n)) return null;
        return PROVINCES[n] || null;
      }

      function buildDatasets(items){
        const withYear = items.filter(d => d.year != null);
        const noYear = items.filter(d => d.year == null);
        const years = withYear.map(d => Number(d.year)).filter(v => !Number.isNaN(v));
        const yLow = years.length ? Math.min(...years) : null;
        const yHigh = years.length ? Math.max(...years) : null;

        const makePoint = (d) => ({
          x: toNumberES(d.km),
          y: toNumberES(d.price),
          url: d.url || null,
          km_fmt: fmtKm(d.km),
          precio_fmt: fmtEur(d.price),
          year_fmt: d.year != null ? String(d.year) : '-',
          provincia: (provinceName(d.provinceId ?? d.province_id ?? d.provinciaId ?? d.provincia_id)
            || d.provincia || d.province || d.localidad || d.location || d.city || null)
        });

        const normal = withYear.filter(d => d.tag === 'normal').map(d => ({ ...makePoint(d), backgroundColor: yearColor(d.year, yLow, yHigh), borderColor: darkBlue, borderWidth: 1.5 }));
        const chollo = withYear.filter(d => d.tag === 'chollo').map(d => ({ ...makePoint(d), backgroundColor: green, borderColor: '#ffffff', borderWidth: 1.8 }));
        const caro   = withYear.filter(d => d.tag === 'caro'  ).map(d => ({ ...makePoint(d), backgroundColor: red,   borderColor: '#ffffff', borderWidth: 1.8 }));
        const sinAnno = noYear.map(d => ({ ...makePoint(d), backgroundColor: grayPoint, borderColor: darkBlue, borderWidth: 1.5 }));

        return { normal, chollo, caro, sinAnno, yLow, yHigh };
      }

      function computeEq(items){
        const found = items.find(d => typeof d.eq_text === 'string' && d.eq_text);
        return found ? found.eq_text : '';
      }

      function extractFit(items){
        const withFit = items.find(d => Array.isArray(d.fit_x) && Array.isArray(d.fit_y));
        if (!withFit) return null;
        const xy = withFit.fit_x.map((x, i) => ({ x: toNumberES(x), y: toNumberES(withFit.fit_y[i]) }))
          .filter(p => Number.isFinite(p.x) && Number.isFinite(p.y));
        return xy.length ? xy : null;
      }

      function buildChart(items, marca, modelo){
        const { normal, chollo, caro, sinAnno } = buildDatasets(items);
        const fit = extractFit(items);
        const eq = computeEq(items);

        $mm.textContent = `${marca || ''} ${modelo || ''}`.trim() || '-';
        $eq.textContent = eq || '';
        $msg.style.display = 'none';

        const datasets = [];

        // Banda y curva de ajuste
        if (fit) {
          const residuals = items.map(d => toNumberES(d.residual)).filter(v => Number.isFinite(v));
          let sigma = 0;
          if (residuals.length >= 3) {
            const sorted = residuals.slice().sort((a,b)=>a-b);
            const median = sorted[Math.floor(sorted.length/2)];
            const absDev = residuals.map(v => Math.abs(v - median)).sort((a,b)=>a-b);
            const mad = absDev[Math.floor(absDev.length/2)] || 0;
            const stddev = (() => { const m = residuals.reduce((s,v)=>s+v,0)/residuals.length; const vv = residuals.reduce((s,x)=>s+(x-m)*(x-m),0)/residuals.length; return Math.sqrt(vv); })();
            sigma = mad > 0 ? 1.4826 * mad : stddev;
          }
          if (sigma > 0) {
            const z = 1.96;
            const bandHigh = fit.map(p => ({ x: p.x, y: p.y + z * sigma }));
            const bandLow  = fit.map(p => ({ x: p.x, y: p.y - z * sigma }));
            datasets.push({ label: 'Band High', type: 'line', data: bandHigh, parsing: false, borderColor: 'rgba(0,0,0,0)', pointRadius: 0, tension: 0 });
            datasets.push({ label: 'Band Low',  type: 'line', data: bandLow,  parsing: false, borderColor: 'rgba(0,0,0,0)', pointRadius: 0, tension: 0, fill: { target: '-1' }, backgroundColor: 'rgba(226,232,240,0.10)' });
          }
          datasets.push({ label: 'Ajuste', type: 'line', data: fit, parsing: false, borderColor: blue, borderWidth: 2.5, pointRadius: 0, tension: 0 });
        }

        // Puntos
        const normalBG  = normal.map(p => p.backgroundColor || '#3b82f6');
        const cholloBG  = chollo.map(p => p.backgroundColor || green);
        const caroBG    = caro.map(p => p.backgroundColor   || red);
        const sinAnnoBG = sinAnno.map(p => p.backgroundColor || grayPoint);
        const whiteBordersN = normal.map(() => darkBlue);
        const whiteBordersE = chollo.map(() => '#166534');
        const whiteBordersC = caro.map(() => '#7f1d1d');
        const whiteBordersS = sinAnno.map(() => darkBlue);

        datasets.push(
          { label: 'Normal', data: normal, parsing: false, type: 'scatter', showLine: false, pointRadius: 5, pointHoverRadius: 6, pointBackgroundColor: normalBG, pointBorderColor: whiteBordersN, pointBorderWidth: 1 },
          { label: 'Chollo', data: chollo, parsing: false, type: 'scatter', showLine: false, pointRadius: 6, pointHoverRadius: 7, pointBackgroundColor: cholloBG, pointBorderColor: whiteBordersE, pointBorderWidth: 1 },
          { label: 'Timo',   data: caro,   parsing: false, type: 'scatter', showLine: false, pointRadius: 6, pointHoverRadius: 7, pointBackgroundColor: caroBG, pointBorderColor: whiteBordersC, pointBorderWidth: 1 },
          { label: 'Sin año',data: sinAnno,parsing: false, type: 'scatter', showLine: false, pointRadius: 5, pointHoverRadius: 6, pointBackgroundColor: sinAnnoBG, pointBorderColor: whiteBordersS, pointBorderWidth: 1 }
        );

        if (![...normal, ...chollo, ...caro, ...sinAnno].length && !fit) {
          $msg.textContent = 'No hay puntos válidos para graficar (revisa km/precio).';
          $msg.style.display = '';
          if (window.chart) { try { window.chart.destroy(); } catch {} }
          return;
        }

        if (window.chart) { try { window.chart.destroy(); } catch {} }
        try {
          const ctx2d = canvas.getContext('2d');
          window.chart = new Chart(ctx2d, {
            type: 'scatter',
            data: { datasets },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              scales: {
                x: {
                  title: { display: true, text: 'Kilómetros recorridos (km)', color: textColor },
                  grid: { color: gridColor },
                  ticks: { color: textColor, callback: (v) => Number(v).toLocaleString('es-ES') }
                },
                y: {
                  title: { display: true, text: 'Precio (€)', color: textColor },
                  grid: { color: gridColor },
                  ticks: { color: textColor, callback: (v) => Number(v).toLocaleString('es-ES') }
                }
              },
              plugins: {
                legend: { labels: { color: textColor } },
                tooltip: {
                  callbacks: {
                    label(ctx){
                      const p = ctx.raw || {};
                      const base = `${ctx.dataset.label || ''}: `;
                      return [
                        base + `${p.km_fmt || ''} · ${p.precio_fmt || ''}`,
                        `Año: ${p.year_fmt || '-'}`,
                        p.url ? `URL: ${p.url}` : ''
                      ].filter(Boolean);
                    }
                  }
                }
              },
              onClick(evt){
                const points = window.chart.getElementsAtEventForMode(evt, 'nearest', { intersect: true }, true);
                if (!points.length) return;
                const ds = window.chart.data.datasets[points[0].datasetIndex];
                const p = ds.data[points[0].index];
                if (p && p.url) window.open(p.url, '_blank');
              }
            }
          });
          // Sobrescribe tooltip y leyenda para alinear con docs/index.html
          if (window.chart && window.chart.options && window.chart.options.plugins) {
            // Reordenar tooltip
            if (window.chart.options.plugins.tooltip && window.chart.options.plugins.tooltip.callbacks) {
              window.chart.options.plugins.tooltip.callbacks.label = (ctx) => {
                const p = ctx.raw || {};
                return [
                  `Año: ${p.year_fmt || '-'}`,
                  `Km: ${p.km_fmt || '-'}`,
                  `Precio: ${p.precio_fmt || '-'}`,
                  `Provincia: ${p.provincia || '-'}`,
                  p.url ? `URL: ${p.url}` : ''
                ].filter(Boolean);
              };
            }
            // Ocultar entradas de leyenda "Sin año" y "Band Low"
            if (window.chart.options.plugins.legend && window.chart.options.plugins.legend.labels) {
              window.chart.options.plugins.legend.labels.filter = (item, chart) => {
                try {
                  const ds = chart?.data?.datasets?.[item.datasetIndex];
                  const lab = String((ds && ds.label) || item.text || '').toLowerCase();
                  if (lab.includes('sin a')) return false;
                  if (lab.includes('band low')) return false;
                  return true;
                } catch {
                  return true;
                }
              };
            }
            try { window.chart.update(); } catch {}
          }
          // Asegurar que el canvas tiene medidas después del layout inicial
          queueMicrotask(() => window.chart && window.chart.resize());
        } catch (err) {
          console.error('Chart init error', err);
          $msg.textContent = 'Error creando el gráfico';
          $msg.style.display = '';
        }
      }

      async function cargar(){
        const marca = $marca.value.trim();
        const modelo = $modelo.value.trim();
        $mm.textContent = `${marca} ${modelo}`.trim() || '-';
        $eq.textContent = '';
        $msg.style.display = 'none';
        if (!marca || !modelo) {
          $msg.textContent = 'Introduce marca y modelo';
          $msg.style.display = '';
          return;
        }
        try {
          const url = `/api/moto/model/${encodeURIComponent(marca)}/${encodeURIComponent(modelo)}`;
          const res = await fetch(url, { cache: 'no-cache' });
          if (!res.ok) throw new Error(`Error ${res.status}: no se pudo obtener datos`);
          const items = await res.json();

          if (!Array.isArray(items) || !items.length) {
            throw new Error('Sin datos para graficar (la API devolvió lista vacía).');
          }

          // Normaliza nombres y parsea números robustamente
          const data = items.map(d => ({
            ...d,
            km: d.km ?? d.kilometros ?? d.kilometers,
            price: d.price != null ? d.price : d.precio
          }))
          .map(d => ({
            ...d,
            km: toNumberES(d.km),
            price: toNumberES(d.price),
          }))
          .filter(d => Number.isFinite(d.km) && Number.isFinite(d.price));

          if (!data.length) {
            throw new Error('Datos recibidos pero sin km/precio numéricos.');
          }

          buildChart(data, marca, modelo);
        } catch (e) {
          console.error(e);
          $msg.textContent = (e && e.message) ? e.message : 'Error cargando datos';
          $msg.style.display = '';
          if (window.chart) { try { window.chart.destroy(); } catch {} }
        }
      }

      document.getElementById('cargar').addEventListener('click', cargar);
      $marca.addEventListener('change', updateModelOptions);
      // Carga inicial: poblar marcas, aplicar query params si existen, luego cargar
      (async () => {
        const params = new URLSearchParams(window.location.search || '');
        const qMarca = (params.get('marca') || '').trim().toLowerCase();
        const qModelo = (params.get('modelo') || '').trim().toLowerCase();
        await populateBrands();
        if (qMarca) {
          // si la marca existe en el select, usarla
          const has = [...$marca.options].some(o => String(o.value).toLowerCase() === qMarca);
          if (has) $marca.value = qMarca;
        }
        await updateModelOptions();
        if (qModelo) {
          const hasM = [...$modelo.options].some(o => String(o.value).toLowerCase() === qModelo);
          if (hasM) $modelo.value = qModelo;
        }
        await cargar();
      })();
    </script>
  </body>
</html>
